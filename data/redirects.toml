  url  = "https://ducug-my.sharepoint.com/:f:/g/personal/john_billekens_ducug_nl/IgC61q_t6WpkQIuvta8T4ZgcAbXTnQC0B8tY4pNrnoCBtms?e=tzfyfV"  # nog leeg: bezoekers zien dan "kom later terug"
